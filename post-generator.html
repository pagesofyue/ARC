<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Post Generator (Private)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --ink:#1C2541;
    --ink-soft:#4A5170;
    --page-bg:#EAE7DC;
    --card-bg:#FBF9F3;
    --manila:#D9C8A0;
    --manila-dark:#BFA974;
    --stamp-red:#A63D2F;
    --stamp-teal:#35635A;
    --line:#C9C0A8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding:32px 20px 60px;
  }
  .wrap{ max-width:720px; margin:0 auto; }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.9rem;
    margin:0 0 6px;
  }
  .private-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--stamp-red);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:26px;
  }
  .panel{
    background:var(--manila);
    border:1px solid var(--manila-dark);
    border-radius:8px;
    padding:20px 22px;
    margin-bottom:24px;
  }
  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    opacity:0.75;
    margin-bottom:6px;
  }
  select, input[type="text"], textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--ink);
    border-radius:3px;
    background:var(--card-bg);
    color:var(--ink);
  }
  textarea{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; resize:vertical; }
  .closing-textarea{ min-height:90px; }
  .generate-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--card-bg);
    border:none;
    border-radius:20px;
    padding:11px 22px;
    cursor:pointer;
    margin-top:6px;
  }
  .generate-btn:hover{ background:var(--stamp-red); }
  .generate-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .status-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin:10px 0 0;
  }
  .post-card{
    background:var(--card-bg);
    border:1px solid var(--ink);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:16px;
  }
  .post-card-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
  }
  .char-count{ color:var(--ink-soft); }
  .char-count.over{ color:var(--stamp-red); font-weight:700; }
  .post-text{
    width:100%;
    min-height:140px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    line-height:1.5;
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px;
    background:#fff;
    white-space:pre-wrap;
  }
  .copy-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--ink);
    border-radius:3px;
    padding:6px 12px;
    cursor:pointer;
    margin-top:8px;
  }
  .copy-btn:hover{ background:var(--ink); color:var(--card-bg); }
  .copy-btn.copied{ background:var(--stamp-teal); color:#fff; border-color:var(--stamp-teal); }
</style>
</head>
<body>
<div class="wrap">
  <h1>ARC Post Generator</h1>
  <div class="private-note">Private tool, not linked from the public site</div>

  <div class="panel">
    <div class="field">
      <label for="batchSelect">Batch</label>
      <select id="batchSelect">
        <option value="">Loading batches...</option>
      </select>
    </div>
    <div class="field">
      <label for="catalogLink">Catalog Link</label>
      <input type="text" id="catalogLink" value="https://arc.pagesofyue.com">
    </div>
    <div class="field">
      <label for="closingText">Closing Message (shown once, on the last post)</label>
      <textarea id="closingText" class="closing-textarea">A repost of this would mean a lot and help these opportunities reach more readers. You can follow or check the catalog from time to time for new updates. Thank you for your support! 🫶</textarea>
    </div>
    <button class="generate-btn" id="generateBtn" disabled>Generate Post</button>
    <div class="status-line" id="statusLine">Loading books from your sheet...</div>
  </div>

  <div id="output"></div>
</div>

<script>
  /*
    Reuses the same published CSV link as your main site, since
    this reads the exact same book data. If you ever update
    SHEET_CSV_URL on the main site, update it here too.
  */
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQPbiaJvtyol6XVcK3xcac2_hAAxlJ3w796tAThz53CCXTDW5kHycW15YLT5B6wz8wIVk8iBDyZaVnG/pub?gid=0&single=true&output=csv";
  const CHAR_LIMIT = 500;

  let BOOKS = [];

  function getField(row, name){
    const targetKey = name.trim().toLowerCase();
    const actualKey = Object.keys(row).find(k => k.trim().toLowerCase() === targetKey);
    return actualKey ? (row[actualKey] || '').trim() : '';
  }

  function rowToBook(row){
    return {
      title: getField(row, 'Title'),
      socialMedia: getField(row, 'Social Media'),
      batchNo: getField(row, 'Batch No'),
      visibility: getField(row, 'Visibility').toLowerCase()
    };
  }

  function formatHandle(raw){
    if(!raw) return '';
    if(raw.startsWith('@')) return raw;
    if(/^https?:\/\//i.test(raw)) return raw;
    return '@' + raw.replace(/^@/, '');
  }

  function loadBooks(){
    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results){
        const rows = (results.data || []).map(rowToBook);
        BOOKS = rows.filter(b => b.title && b.visibility !== 'hide');
        populateBatches();
        document.getElementById('statusLine').textContent = `Loaded ${BOOKS.length} books.`;
        document.getElementById('generateBtn').disabled = false;
      },
      error: function(err){
        document.getElementById('statusLine').textContent = 'Could not load your sheet. Check your connection and try refreshing.';
        console.error(err);
      }
    });
  }

  function populateBatches(){
    const select = document.getElementById('batchSelect');
    select.innerHTML = '';
    const batches = [...new Set(BOOKS.map(b=>b.batchNo).filter(Boolean))]
      .sort((a,b)=> a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
    if(batches.length === 0){
      select.innerHTML = '<option value="">No batches found in your sheet</option>';
      return;
    }
    batches.forEach(b=>{
      const opt = document.createElement('option');
      opt.value = b; opt.textContent = b;
      select.appendChild(opt);
    });
  }

  function buildPages(catalogLink, lines, closing){
    const baseHeader = `New ARC sign-ups have been added to the catalog (${catalogLink})`;

    function pageHeader(k, n){
      if(n === 1) return baseHeader;
      if(k === 1) return `${baseHeader} (${k}/${n})`;
      return `(${k}/${n})`;
    }

    for(let n = 1; n <= Math.max(lines.length, 1); n++){
      let pages = [];
      let idx = 0;
      let ok = true;

      for(let k = 1; k <= n; k++){
        const header = pageHeader(k, n);
        const isLast = k === n;
        let pageLines = [];

        while(idx < lines.length){
          const tentativeLines = [...pageLines, lines[idx]];
          const tentativeContent = header + '\n' + tentativeLines.join('\n') + (isLast ? '\n\n' + closing : '');
          if(tentativeContent.length <= CHAR_LIMIT){
            pageLines.push(lines[idx]);
            idx++;
          } else {
            break;
          }
        }

        if(pageLines.length === 0){
          const emptyContent = header + (isLast ? '\n\n' + closing : '');
          if(emptyContent.length > CHAR_LIMIT || idx < lines.length){
            ok = false;
            break;
          }
        }

        const finalContent = header + (pageLines.length ? '\n' + pageLines.join('\n') : '') + (isLast ? '\n\n' + closing : '');
        pages.push(finalContent);
      }

      if(ok && idx >= lines.length && pages.length === n){
        return pages;
      }
    }

    return [baseHeader + '\n\n' + closing];
  }

  function renderOutput(pages){
    const output = document.getElementById('output');
    output.innerHTML = '';
    pages.forEach((text, i)=>{
      const card = document.createElement('div');
      card.className = 'post-card';
      const over = text.length > CHAR_LIMIT;
      card.innerHTML = `
        <div class="post-card-head">
          <span>Post ${i+1} of ${pages.length}</span>
          <span class="char-count ${over ? 'over' : ''}">${text.length} / ${CHAR_LIMIT}</span>
        </div>
        <textarea class="post-text" readonly>${text}</textarea>
        <button class="copy-btn">Copy</button>
      `;
      const btn = card.querySelector('.copy-btn');
      btn.addEventListener('click', function(){
        navigator.clipboard.writeText(text).then(()=>{
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(()=>{ btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
        });
      });
      output.appendChild(card);
    });
  }

  document.getElementById('generateBtn').addEventListener('click', function(){
    const batch = document.getElementById('batchSelect').value;
    const catalogLink = document.getElementById('catalogLink').value.trim();
    const closing = document.getElementById('closingText').value.trim();

    const batchBooks = BOOKS.filter(b => b.batchNo === batch);
    if(batchBooks.length === 0){
      document.getElementById('statusLine').textContent = 'No books found for that batch.';
      document.getElementById('output').innerHTML = '';
      return;
    }

    const lines = batchBooks.map(b=>{
      const handle = formatHandle(b.socialMedia);
      return handle ? `\uD83D\uDCDA ${b.title} by ${handle}` : `\uD83D\uDCDA ${b.title}`;
    });

    const pages = buildPages(catalogLink, lines, closing);
    renderOutput(pages);
    document.getElementById('statusLine').textContent = `Generated ${pages.length} post${pages.length > 1 ? 's' : ''} for ${batchBooks.length} book${batchBooks.length > 1 ? 's' : ''} in batch "${batch}".`;
  });

  loadBooks();
</script>
</body>
</html>
